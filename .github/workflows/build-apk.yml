name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet
        run: unzip -q LiveBridge.zip

      - name: Corriger les erreurs de compilation Compose
        run: bash .github/scripts/build-fixes.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Accepter les licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compiler l'APK
        working-directory: LiveBridge
        run: gradle assembleDebug --stacktrace

      - name: Vérifier l'APK
        run: test -s LiveBridge/app/build/outputs/apk/debug/app-debug.apk

      - name: Mettre à jour l'archive source LiveBridge
        run: |
          rm -f LiveBridge.zip
          zip -qr LiveBridge.zip LiveBridge -x "LiveBridge/app/build/*" "LiveBridge/.gradle/*"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LiveBridge.zip
          git diff --cached --quiet || git commit -m "chore: package latest LiveBridge mobile studio UI [skip ci]"
          git push

      - name: Renommer l'APK
        run: cp LiveBridge/app/build/outputs/apk/debug/app-debug.apk LiveBridge-debug.apk

      - name: Publier l'APK dans une Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LiveBridge build ${{ github.run_number }}
          files: LiveBridge-debug.apk

      - name: Garder aussi l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: LiveBridge-debug-apk
          path: LiveBridge-debug.apk
