name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier l’archive
        run: |
          set -euo pipefail

          if [[ ! -f "LiveBridge.zip" ]]; then
            echo "::error::Le fichier LiveBridge.zip est introuvable."
            exit 1
          fi

          unzip -l LiveBridge.zip

      - name: Décompresser le projet
        run: |
          set -euo pipefail
          unzip -q -o LiveBridge.zip

          if [[ ! -d "LiveBridge" ]]; then
            echo "::error::Le dossier LiveBridge est introuvable après extraction."
            echo "Contenu du répertoire :"
            find . -maxdepth 2 -type d -print
            exit 1
          fi

      - name: Configurer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Accepter les licences Android
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [[ -x "$SDKMANAGER" ]]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          else
            echo "::warning::sdkmanager est introuvable. Les licences Android n'ont pas été automatiquement acceptées."
          fi

      - name: Compiler l’APK
        working-directory: LiveBridge
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "./gradlew" ]]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          elif command -v gradle >/dev/null 2>&1; then
            echo "::warning::gradlew est introuvable. Utilisation de Gradle installé sur le runner."
            gradle assembleDebug --stacktrace
          else
            echo "::error::Ni gradlew ni Gradle ne sont disponibles."
            exit 1
          fi

      - name: Vérifier l’APK généré
        shell: bash
        run: |
          set -euo pipefail

          APK="LiveBridge/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::L’APK n’a pas été généré."
            find LiveBridge -type f -name "*.apk" -print
            exit 1
          fi

          ls -lh "$APK"

      - name: Renommer l’APK
        run: cp LiveBridge/app/build/outputs/apk/debug/app-debug.apk LiveBridge-debug.apk

      - name: Publier l’APK dans une Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LiveBridge build ${{ github.run_number }}
          files: LiveBridge-debug.apk

      - name: Conserver l’APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: LiveBridge-debug-apk
          path: LiveBridge-debug.apk
          if-no-files-found: error
